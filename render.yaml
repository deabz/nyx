services:
  - type: web
    name: nyx
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: MYSTIC_DISCORD_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "600"
      - key: WEATHER_CACHE_MAX_ENTRIES
        value: "100"
